<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Diario - Nueva contraseña</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#E6F4FE;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:360px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    text-align:center;
}

.logo {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
}

h1{
    color:#208AEF;
    margin-top:0;
    margin-bottom:10px;
}

.subtitle{
    color:#64748B;
    margin-bottom:30px;
    line-height:1.5;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-bottom:16px;
    border:1px solid #D6E8F7;
    border-radius:12px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#208AEF;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#208AEF;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1978D6;
}

.message{
    margin-top:20px;
    color:#16A34A;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<img
    src="icontr.png"
    alt="Mi Diario"
    class="logo">

<h1>Mi Diario</h1> 

<div class="subtitle">
Su contraseña será actualizada de forma segura.
</div>

<input
type="password"
id="password"
placeholder="Nueva contraseña">

<input
type="password"
id="confirm"
placeholder="Confirmar contraseña">

<button id="changePassword">
    Cambiar contraseña
</button>

<button id="abrirApp" onclick="window.location.href='midiario://';">
    Abrir Mi Diario
</button>

<div class="message" id="message">
</div>

</div>

<script>

const supabaseUrl = "https://bslmzjleijdwjgxwwktu.supabase.co";
const supabaseAnonKey = "sb_publishable_BuNMHFQ71oidIwZ_bJChbA_NdeqzRPb";
const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseAnonKey
);

async function changePassword() {
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const message = document.getElementById("message");
    const button = document.getElementById("changePassword");

    if (password.length < 6) {
        message.style.color = "#DC2626";
        message.innerText = "La contraseña debe tener al menos 6 caracteres."
        return;
    }

    if (password !== confirm) {
        message.style.color = "#DC2626";
        message.innerText = "Las contraseñas no coinciden.";
        return;
    }

    button.disabled = true;
    button.innerText = "Actualizando...";
    
    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    if (error) {
        message.style.color = "#DC2626";
        message.innerText = error.message;
        button.disabled = false;
        button.innerText = "Cambiar contraseña";
        return;
    }

    document.getElementById("password").style.display = "none";
    document.getElementById("confirm").style.display = "none";
    document.getElementById("changePassword").style.display = "none";
    document.querySelector(".subtitle").style.display = "none";
    
    message.style.color = "#16A34A";
    message.innerText = "Su contraseña fue cambiada correctamente.";
    document.getElementById("abrirApp").style.display = "";

}

async function init() {
    const fragment = window.location.hash.substring(1);
    const params = new URLSearchParams(fragment);
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");
    //console.log('!!!!!!!acces=' + accessToken);
    //console.log('!!!!!!!refresh=' + refreshToken);

    if (accessToken && refreshToken) {

        const { error } =
            await supabaseClient.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken,
            });
    
       if (error) {
            console.error(error);
            document.getElementById("message").innerText = error.message;
            return;
        }

        //document.getElementById("message").innerText = "Sesión restaurada correctamente.";
    }
}

document.getElementById("abrirApp").style.display = "none";

document.getElementById("changePassword").addEventListener(
        "click",
        changePassword
    );

init();

</script>

</body>

</html>
